<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My ATM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .atm {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .logo {
            font-size: 55px;
        }

        h1 {
            color: #1b5e20;
            margin-top: 5px;
        }

        h2 {
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: none;
            border-radius: 7px;
            background: #1b5e20;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2e7d32;
        }

        .withdraw {
            background: #c62828;
        }

        .withdraw:hover {
            background: #e53935;
        }

        .logout {
            background: #555;
        }

        .logout:hover {
            background: #333;
        }

        .balance {
            background: #f1f8e9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .balance h2 {
            color: #1b5e20;
            font-size: 28px;
        }

        .message {
            background: #eeeeee;
            padding: 12px;
            border-radius: 7px;
            margin: 15px 0;
            color: #333;
        }

        .section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>

</head>

<body>

    <div class="atm">

        <div class="logo">🏧</div>

        <h1>MY ATM</h1>

        {% if not logged_in %}

        <h2>Welcome</h2>

        <p>Please enter your PIN</p>

        <form action="/login" method="POST">

            <label>ATM PIN</label>

            <input type="password" name="pin" placeholder="Enter your PIN" maxlength="4" required>

            <button type="submit">
                LOGIN
            </button>

        </form>

        {% if message %}

        <div class="message">
            {{ message }}
        </div>

        {% endif %}

        {% else %}

        <h2>Welcome to your account</h2>

        <div class="balance">

            <p>Available Balance</p>

            <h2>
                Ksh {{ "{:,.2f}".format(balance) }}
            </h2>

        </div>


        <!-- Deposit -->

        <div class="section">

            <h3>Deposit Money</h3>

            <form action="/deposit" method="POST">

                <input type="number" name="amount" placeholder="Enter amount" min="1" step="0.01" required>

                <button type="submit">
                    💰 Deposit
                </button>

            </form>

        </div>


        <!-- Withdraw -->

        <div class="section">

            <h3>Withdraw Money</h3>

            <form action="/withdraw" method="POST">

                <input type="number" name="amount" placeholder="Enter amount" min="1" step="0.01" required>

                <button type="submit" class="withdraw">
                    💵 Withdraw
                </button>

            </form>

        </div>


        {% if message %}

        <div class="message">
            {{ message }}
        </div>

        {% endif %}


        <!-- Logout -->

        <a href="/logout">

            <button class="logout">
                🚪 Exit / Logout
            </button>

        </a>

        {% endif %}

    </div>

</body>

</html>
